<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SchoolConnect | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-brand">

<a href="index.html" class="logo">
<span class="logo-icon">SC</span>
SchoolConnect
</a>

</div>


<div class="auth-card">

<div class="auth-heading">

<span class="hero-badge">WELCOME BACK</span>

<h1>Sign in</h1>

<p>
Access your SchoolConnect account.
</p>

</div>


<form id="loginForm">

<div class="form-group">

<label>Email Address</label>

<input
type="email"
id="loginEmail"
placeholder="student@school.co.za"
required>

</div>


<div class="form-group">

<label>Password</label>

<div class="password-field">

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

<button type="button" class="password-toggle">
👁
</button>

</div>

</div>


<div class="form-options">

<label>
<input type="checkbox">
Remember me
</label>

<a href="#">Forgot password?</a>

</div>


<button class="btn btn-primary full-width">
Sign In
</button>

</form>


<div class="auth-divider">
<span>OR</span>
</div>


<p class="auth-footer">

Don't have an account?

<a href="register.html">
Create one
</a>

</p>

</div>


<p class="back-home">
<a href="index.html">← Back to SchoolConnect</a>
</p>

</div>

<script src="script.js"></script>

</body>
</html>
