<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SchoolConnect | Register</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">

<div class="auth-container">

<div class="auth-brand">

<a href="index.html" class="logo">
<span class="logo-icon">SC</span>
SchoolConnect
</a>

</div>


<div class="auth-card register-card">

<div class="auth-heading">

<span class="hero-badge">JOIN SCHOOLCONNECT</span>

<h1>Create account</h1>

<p>
Create your school community account.
</p>

</div>


<form id="registerForm">

<div class="form-row">

<div class="form-group">

<label>First Name</label>

<input
type="text"
placeholder="First name"
required>

</div>


<div class="form-group">

<label>Last Name</label>

<input
type="text"
placeholder="Last name"
required>

</div>

</div>


<div class="form-group">

<label>School Email</label>

<input
type="email"
placeholder="name@school.co.za"
required>

</div>


<div class="form-row">

<div class="form-group">

<label>Role</label>

<select required>

<option value="">Select role</option>

<option>Student</option>
<option>Teacher</option>
<option>Administrator</option>

</select>

</div>


<div class="form-group">

<label>Grade</label>

<select>

<option>Select grade</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>

</div>

</div>


<div class="form-group">

<label>School</label>

<select required>

<option value="">Select your school</option>

<option>SchoolConnect High School</option>
<option>Johannesburg Secondary School</option>
<option>Pretoria Academy</option>
<option>Rosebank High School</option>

</select>

</div>


<div class="form-group">

<label>Password</label>

<input
type="password"
placeholder="Create a password"
required>

</div>


<label class="terms">

<input type="checkbox" required>

I agree to the Terms and Conditions.

</label>


<button class="btn btn-primary full-width">
Create Account
</button>

</form>


<p class="auth-footer">

Already have an account?

<a href="login.html">
Sign in
</a>

</p>

</div>

<p class="back-home">
<a href="index.html">← Back to SchoolConnect</a>
</p>

</div>

<script src="script.js"></script>

</body>
</html>
